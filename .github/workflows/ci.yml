# Tests on every push and pull request. On main and on version tags (v1.2.3)
# it also builds the image for amd64 + arm64 and pushes it to Docker Hub;
# a version tag also pushes the Helm chart to oci://ghcr.io/<owner>/charts and
# attaches it to a GitHub release.
#
# Set up once in the GitHub repo (Settings → Secrets and variables → Actions):
#   variable DOCKERHUB_USERNAME  your Docker Hub user, e.g. lars
#   secret   DOCKERHUB_TOKEN     a Docker Hub access token (Read & Write)
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: helm lint deploy/helm/housecontrol --set image.repository=example/housecontrol
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest
      - run: helm unittest deploy/helm/housecontrol

  image:
    needs: [backend, frontend, chart]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/housecontrol
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2 and latest;  main -> main;  every build -> sha-abc1234
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart-release:
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      packages: write   # push the chart to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: package the chart with the tag's version
        env:
          IMAGE_REPO: docker.io/${{ vars.DOCKERHUB_USERNAME }}/housecontrol
        run: |
          v="${GITHUB_REF_NAME#v}"
          # the released chart points at the released image, so no --set image.repository is needed
          sed -i "s|^  repository: \"\"|  repository: $IMAGE_REPO|" deploy/helm/housecontrol/values.yaml
          grep -q "repository: $IMAGE_REPO" deploy/helm/housecontrol/values.yaml
          helm package deploy/helm/housecontrol --version "$v" --app-version "$v" -d dist
      - name: push the chart to ghcr.io (OCI)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # registry paths must be lower case
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/housecontrol-*.tgz "oci://ghcr.io/$owner/charts"
          echo "helm install housecontrol oci://ghcr.io/$owner/charts/housecontrol --version ${GITHUB_REF_NAME#v}" >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub release with the chart attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --title "$GITHUB_REF_NAME"
