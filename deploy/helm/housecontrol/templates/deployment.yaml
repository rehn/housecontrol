apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "housecontrol.fullname" . }}
  labels:
    {{- include "housecontrol.labels" . | nindent 4 }}
spec:
  # Settings are files on one volume, and the MQTT client id must be unique:
  # exactly one pod, and the old one stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "housecontrol.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "housecontrol.secretData" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "housecontrol.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "housecontrol.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: housecontrol
          image: {{ include "housecontrol.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: TRUST_PROXY
              value: {{ include "housecontrol.trustProxy" . | quote }}
            {{- if or .Values.auth.password .Values.auth.existingSecret }}
            - name: ADMIN_USERNAME
              value: {{ .Values.auth.username | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (include "housecontrol.fullname" .) }}
                  key: {{ if .Values.auth.existingSecret }}{{ .Values.auth.existingSecretKey }}{{ else }}ADMIN_PASSWORD{{ end }}
            {{- end }}
            {{- with .Values.mqtt.url }}
            - name: MQTT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mqtt.username }}
            - name: MQTT_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.mqtt.password .Values.mqtt.existingSecret }}
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.existingSecret | default (include "housecontrol.fullname" .) }}
                  key: {{ if .Values.mqtt.existingSecret }}{{ .Values.mqtt.existingSecretKey }}{{ else }}MQTT_PASSWORD{{ end }}
            {{- end }}
            - name: Z2M_BASE_TOPIC
              value: {{ .Values.mqtt.baseTopic | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "housecontrol.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
