suite: volume and secret
templates:
  - pvc.yaml
  - secret.yaml
set:
  image.repository: docker.io/lars/housecontrol
tests:
  - it: claims a small volume that survives helm uninstall
    template: pvc.yaml
    asserts:
      - isKind: { of: PersistentVolumeClaim }
      - equal: { path: spec.resources.requests.storage, value: 1Gi }
      - equal: { path: "metadata.annotations[\"helm.sh/resource-policy\"]", value: keep }
      - contains: { path: spec.accessModes, content: ReadWriteOnce }

  - it: can pick a storage class
    template: pvc.yaml
    set:
      persistence.storageClass: longhorn
    asserts:
      - equal: { path: spec.storageClassName, value: longhorn }

  - it: makes no claim with an existing one or without persistence
    template: pvc.yaml
    set:
      persistence.existingClaim: mine
    asserts:
      - hasDocuments: { count: 0 }

  - it: makes no Secret when there is nothing secret
    template: secret.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: stores the passwords in a Secret
    template: secret.yaml
    set:
      auth.password: hemligt
      mqtt.username: ha
      mqtt.password: mqttpw
    asserts:
      - isKind: { of: Secret }
      - equal: { path: stringData.ADMIN_PASSWORD, value: hemligt }
      - equal: { path: stringData.MQTT_PASSWORD, value: mqttpw }

  - it: leaves passwords out when an existing Secret is used
    template: secret.yaml
    set:
      auth.existingSecret: login
      auth.password: ignored
    asserts:
      - hasDocuments: { count: 0 }
