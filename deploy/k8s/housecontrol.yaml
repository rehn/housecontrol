apiVersion: v1
kind: Namespace
metadata:
  name: housecontrol
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: housecontrol-backend
  namespace: housecontrol
data:
  MQTT_URL: tcp://192.168.1.201:1883 # Mosquitto on the Raspberry Pi
  MQTT_CLIENT_ID: housecontrol
  Z2M_BASE_TOPIC: zigbee2mqtt
  HTTP_ADDR: ":8080"
---
# Create the real secret with:
#   kubectl -n housecontrol create secret generic housecontrol-mqtt \
#     --from-literal=MQTT_USERNAME=... --from-literal=MQTT_PASSWORD=...
# (leave both empty if Mosquitto allows anonymous clients)
apiVersion: v1
kind: Secret
metadata:
  name: housecontrol-mqtt
  namespace: housecontrol
type: Opaque
stringData:
  MQTT_USERNAME: ""
  MQTT_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: housecontrol
spec:
  replicas: 1
  selector:
    matchLabels: { app: housecontrol-backend }
  template:
    metadata:
      labels: { app: housecontrol-backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/CHANGE_ME/housecontrol-backend:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: housecontrol-backend }
            - secretRef: { name: housecontrol-mqtt }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: housecontrol
spec:
  selector: { app: housecontrol-backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: housecontrol
spec:
  replicas: 1
  selector:
    matchLabels: { app: housecontrol-frontend }
  template:
    metadata:
      labels: { app: housecontrol-frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/CHANGE_ME/housecontrol-frontend:latest
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: housecontrol
spec:
  selector: { app: housecontrol-frontend }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
# One host: /api (REST + WebSocket) -> Go backend, everything else -> Next.js.
# Annotations are for ingress-nginx; adjust for Traefik etc.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: housecontrol
  namespace: housecontrol
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: housecontrol.home.lan # CHANGE_ME
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
